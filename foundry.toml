[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
evm_version = "cancun"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = true
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
# NOT the org default of 100000. Every deploy address this repo pins is
# `CREATE2` over creation code, so this number is part of every address and
# codehash already live on chain. Lowering it to match the other deploy repos
# would move all five deployments and orphan every consumer pin, so it stays at
# the value the live deployments were compiled under.
optimizer_runs = 1000000

ffi = true
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
  { access = "read-write", path = "./out/test/" },
  { access = "read-write", path = "./meta" },
  # `script/Build.sol` writes `src/generated/RainlangReferenceExternPointers.sol`.
  { access = "read-write", path = "./src/generated" },
  { access = "read", path = "./out" },
]

gas_limit = "18446744073709551615"

[dependencies]
"rain-math-float-deploy" = "0.1.2"
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
"rain-datacontract" = "0.1.9"
rain-deploy = "0.1.7"
"rain-extrospection" = "0.1.14"
"rain-intorastring" = "0.1.0"
"rain-lib-hash" = "0.1.0"
"rain-lib-memkv" = "0.1.0"
"rain-lib-typecast" = "0.1.0"
"rain-math-binary" = "0.1.4"
"rain-math-float" = "0.2.1"
"rain-metadata" = "0.1.0"
rain-sol-codegen = "0.1.36"
"rain-solmem" = "0.1.28"
"rain-string" = "0.2.0"
"rain-tofu-erc20-decimals" = "0.1.1"
"rainlang-interface" = "0.2.8"

[soldeer]
recursive_deps = false

[fuzz]
runs = 2048
